# dreamteam — hand the io controller to the user manager, so IOWeight= in a USER unit (lanes.slice) is real.
# Copy of record; install as /etc/systemd/system/user@<uid>.service.d/20-delegate-io.conf (systemd/system/README.md).
#
# The vendor unit says Delegate=pids memory cpu: every lane session lives below the user manager, where the io
# controller is then absent and an IOWeight= is silently ignored.
#
# Measured on serialhub 2026-11-21 (systemd 255): after this drop-in and `systemctl daemon-reload` the user
# manager's cgroup HAS the io controller at once, with no restart, and nothing running is disturbed. But the
# running manager does not start using it, also after `systemctl --user daemon-reload`: it takes effect inside
# the user manager at the next boot (or a manager re-exec, not tried: a re-exec that failed would end every
# session of the user). Until then lanes.slice's CPUWeight and MemoryHigh work and its IOWeight waits.
[Service]
Delegate=pids memory cpu io
